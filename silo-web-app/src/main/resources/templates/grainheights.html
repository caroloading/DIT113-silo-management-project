<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base_layout}">

<head>
    <title>Grain Heights</title>
</head>

<body >
<section layout:fragment="content">
    <div class="row pgcontent">
        <div class="col">
            <h3>Grain Heights Readings</h3>
            <div class ="flex-container">
            <table id="distance-table" class="table table-hover table-striped table-responsive caption-top w-auto ">
                <caption>Grain Heights Readings</caption>
                <thead>
                <tr class="tableHeading">
                    <th>ID</th>
                    <th>Grain Height</th>
                    <th>Datetime</th>
                </tr>
                </thead>
                <tbody class="dataTable">
                <tr th:each="grainHeight : ${grainHeights}">
                    <td class="dataID" th:text="${grainHeight.id}"></td>
                    <td class="chartData" th:text="${grainHeight.height}"></td>
                    <td class="chartLabel" th:text="${grainHeight.dateTime}"></td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    <div>
        <canvas id="heightChart"></canvas>
    </div>
    </div>

</section>



<section layout:fragment="custom-scripts">
    <script type="module" src="/scripts/wsSensor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-gradient"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js" integrity="sha512-Hn1w6YiiFw6p6S2lXv6yKeqTk0PLVzeCwWY9n32beuPjQ5HLcvz5l2QsP+KilEr1ws37rCTw3bZpvfvVIeTh0Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script> 
    <script src="/scripts/allCharts.js"></script>
</section>
</body>
</html>

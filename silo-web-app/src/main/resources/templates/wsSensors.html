<!--    Page for simulating sending/receiving values without terminal
        Will be removed before deployment -->

<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title>WebSocket Sensors</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
    />
    <link href="/styles/custom.css" rel="stylesheet"/>
</head>

<body class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh">
<h1>Add Sensor Reading</h1>
<form action="#" th:action="@{/ws/sensors}" th:object="${reading}" method="post">
    <div class="d-flex flex-column align-items-center container">
        <div class="py-4 row">
            <div class="col">
                <label class="form-label" for="temperature">Temperature</label>
                <input class="form-control" id="temperature" type="text" th:field="*{temperature}">
            </div>

            <div class="col">
                <label class="form-label" for="humidity">Humidity</label>
                <input class="form-control" id="humidity" type="text" th:field="*{humidity}">
            </div>

            <div class="col">
                <label class="form-label" for="distance">Distance</label>
                <input class="form-control" id="distance" type="text" th:field="*{distance}">
            </div>
        </div>
        <div class="row">
            <input class="btn btn-primary" style="width: 80px" type="submit" value="Submit"/>
        </div>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous">
</script>
</body>

</html>

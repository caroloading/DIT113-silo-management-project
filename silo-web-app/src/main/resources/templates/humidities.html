<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base_layout}"
>
    <head>
        <title>Humidities</title>
    </head>
    <body>

        <section layout:fragment="content">
            <h3>Humidity Readings</h3>

            <ul class="pt-4 nav nav-tabs" id="humidityTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="humidity-table-tab" data-bs-toggle="tab" data-bs-target="#humidities-table" type="button" role="tab" aria-controls="humidity-table-tab" aria-selected="true">Table</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#humidity-chart" type="button" role="tab" aria-controls="temperature-chart-tab" aria-selected="false">Chart</button>
                </li>
            </ul>
            <div class="tab-content" id="humidities-tab-content">
                <div class="tab-pane fade show active" id="humidities-table" role="tabpanel" aria-labelledby="humidity-table-tab">
                    <table id="humidity-table" class="table table-striped caption-top">
                        <thead>
                            <tr class="tableHeading">
                                <th>ID</th>
                                <th>Humidity</th>
                                <th>Datetime</th>
                            </tr>
                        </thead>
                        <tbody class="dataTable">
                            <tr th:each="humidity : ${humidities}">
                                <td class="dataID" th:text="${humidity.id}"></td>
                                <td class="chartData" th:text="${humidity.hValue}"></td>
                                <td class="chartLabel" th:text="${humidity.dateTime}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="tab-pane fade" id="humidity-chart" role="tabpanel" aria-labelledby="humidity-chart-tab">
                    <div>
                        <canvas id="humBarChart"></canvas>
                    </div>
                </div>
            </div>

        </section>

        <section layout:fragment="custom-scripts">
            <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-gradient"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js" integrity="sha512-Hn1w6YiiFw6p6S2lXv6yKeqTk0PLVzeCwWY9n32beuPjQ5HLcvz5l2QsP+KilEr1ws37rCTw3bZpvfvVIeTh0Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            <script type="text/javascript" src="/scripts/allCharts.js"></script>
            <script src="/scripts/wsSensor.js"></script>
        </section>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base_layout}">
<head>
    <title>Silos</title>
</head>
<body>

<!-- Replaces the content section of the base layout -->
<section layout:fragment="content">
    <div class="row pgcontent">
        <div class="col">
            <h3>Silos</h3>
            <table id="silos-table" class="table table-striped table-lg caption-top">
                <thead>
                    <tr>
                        <th width="55px"></th>
                        <th>ID</th>
                        <th>Name</th>
                        <th class="text-center">Height</th>
                        <th class="text-center">Radius</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="silo : ${silos}">
                        <td class="text-center"><input type="checkbox" name="silo"></td>
                        <td th:text="${silo.id}"></td>
                        <td>Big BOB</td>
                        <td class="text-center" th:text="${silo.height}"></td>
                        <td class="text-center" th:text="${silo.radius}"></td>
                        <td class="text-center">
                            <a th:href="@{/silos/{id}(id=${silo.id})}">
                                View
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<section layout:fragment="custom-scripts">
</section>

</body>
</html>

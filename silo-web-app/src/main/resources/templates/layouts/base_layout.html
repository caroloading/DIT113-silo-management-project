<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
    />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css">
    <link href="/styles/custom.css" rel="stylesheet"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="icon" href="/images/favicons/faviconG-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/images/favicons/faviconG-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/images/favicons/faviconG.ico">
</head>

<body>

    <main class="d-flex flex-row overflow-y-hidden" style="max-height: 100vh">
        <aside th:replace="~{fragments/sidenav::#sidenav}"></aside>
        <nav th:replace="~{fragments/sidenav::#sidenav-mobile}"></nav>
        <div id="siloFullPopup" class="popup">
            <div class="popup-content">
                <p id="popupMessage">Warning! Silo is full. Please organize pickup.</p>
                <button id="closePopup">OK</button>
            </div>
        </div>
        
        <div class="w-100">
            <div th:replace="~{fragments/topbar::#topbar}"></div>
            <div id="fullWarning" class="warning">
                <p class="warning-message">Silo almost full. Plan a pickup.</p>
            </div>
            <div id="tempWarning" class="warning">
                <p class="warning-message">Temperature out of bounds. Please check on the silo.</p>
            </div>
            <div id="humWarning" class="warning">
                <p class="warning-message">Humidity out of bounds. Please check on the silo.</p>
            </div>
            <div class="p-2 h-100">
                <section class="h-100 p-4 overflow-y-auto c-section" layout:fragment="content"></section>
            </div>
        </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
<script src="/scripts/navigation.js"></script>
<section layout:fragment="custom-scripts"></section>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE"></title>

    <!-- <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE"></title> -->

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
    />
    <link href="/styles/custom.css" rel="stylesheet"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- Favicons -->
    <link rel="icon" href="/images/favicons/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/images/favicons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/images/favicons/favicon.ico">
</head>

<body>

<div class="container">
    <div class="row pgmenu">
        <div class="col">
            <nav th:replace="~{fragments/menu::#menu01}"></nav>
        </div>
    </div>

    <section layout:fragment="content">
        <!-- Page content goes here -->
    </section>

    <div class="row pgfooter">
        <div class="col">
            <footer th:replace="~{fragments/footer::#footer01}"></footer>
        </div>
    </div>
</div>

<!--
You can include Popper and Bootstrap JS separately. If you don't plan to use dropdowns,
popovers, or tooltips, save some kilobytes by not including Popper.
-->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous">
</script>
<section layout:fragment="custom-scripts"></section>
</body>
</html>

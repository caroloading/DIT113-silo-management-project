<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base_layout}">
<head>
    <title>Temperatures</title>
</head>
<body>

<section layout:fragment="content">
    <div class="row pgcontent">
        <div class="col">
            <h3>Temperature Readings</h3>
            <table id="temperature-table" class="table table-striped table-responsive caption-top w-auto">
                <caption>Temperature Readings</caption>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Temperature</th>
                    <th>Datetime</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="temperature : ${temperatures}">
                    <td th:text="${temperature.id}"></td>
                    <td class="chartData" th:text="${temperature.tValue}"></td>
                    <td class="chartLabel" th:text="${temperature.dateTime}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div>
        <canvas id="tempLineChart"></canvas>
    </div>
</section>

<section layout:fragment="custom-scripts">
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-gradient"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js" integrity="sha512-Hn1w6YiiFw6p6S2lXv6yKeqTk0PLVzeCwWY9n32beuPjQ5HLcvz5l2QsP+KilEr1ws37rCTw3bZpvfvVIeTh0Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="text/javascript" src="/scripts/allCharts.js"></script>
    <script src="/scripts/wsSensor.js"></script>
</section>
</body>
</html>
